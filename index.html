<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trung tâm điều khiển</title>
<link rel="stylesheet" href="style.css">
</head>
<body spellcheck="false">
<div id="app">
  <aside id="side">
    <div class="brand"><span class="dot"></span>Điều khiển</div>
    <button class="nav prim" data-v="new"><span class="ic">＋</span>Tạo task</button>
    <button class="nav on" data-v="board"><span class="ic">▤</span>Bảng việc<span class="ct" id="ctB">0</span></button>
    <button class="nav" data-v="life"><span class="ic">❀</span>Bảng cuộc sống<span class="ct" id="ctL">0</span></button>
    <button class="nav" data-v="backlog" title="Thả card vào đây để gác lại"><span class="ic">◔</span>Để sau<span class="ct" id="ctK">0</span></button>
    <button class="nav" data-v="habits"><span class="ic">↻</span>Thói quen<span class="ct" id="ctH">0</span></button>
    <button class="nav" data-v="focus" title="Phiên làm việc sâu, hàng đợi và tiến độ"><span class="ic">◉</span>Tập trung<span class="ct" id="ctF">0</span></button>
    <button class="nav" data-v="cal"><span class="ic">▦</span>Lịch</button>
    <button class="nav" data-v="journal"><span class="ic">✎</span>Nhật ký</button>
    <button class="nav" data-v="notes"><span class="ic">❐</span>Ghi chú</button>
    <button class="nav" data-v="dash"><span class="ic">◲</span>Tổng quan</button>
    <button class="nav" data-v="trash"><span class="ic">🗑</span>Thùng rác<span class="ct" id="ctT">0</span></button>

    <div class="navlbl">Tập trung</div>
    <div class="fz side" id="fzSide"></div>

    <div class="navlbl" style="display:flex;align-items:center;white-space:nowrap">Lịch ngày
      <button class="lblbtn" id="sdPrev" title="Ngày trước">‹</button>
      <button class="lblbtn" id="sdDay" style="margin-left:0;white-space:nowrap" title="Về hôm nay"></button>
      <button class="lblbtn" id="sdNext" style="margin-left:0" title="Ngày sau">›</button>
      <button class="lblbtn" id="sdBig" style="margin-left:0" title="Mở lịch lớn theo tuần">⤢</button></div>
    <div class="sdcal" id="sdCal"></div>
    <div class="nofil" style="padding:5px 8px 0">Bấm khung giờ trống để tạo task vào giờ đó</div>

    <div class="navlbl" style="display:flex;align-items:center">Tag<button class="lblbtn" id="tagMgr" title="Thêm, xoá, đổi màu tag">Quản lý</button></div>
    <div class="tagwrap" id="tagFil"></div>

    <div class="sidefoot" style="flex-direction:column;gap:8px">
      <div class="savebar" id="saveBar"></div>
      <button id="fsBtn" hidden style="width:100%">Liên kết file trên ổ đĩa</button>
      <div style="display:flex;gap:6px;width:100%">
        <button id="expBtn">Xuất file</button>
        <button id="impBtn">Nạp file</button>
      </div>
      <input type="file" id="impFile" accept="application/json" hidden>
    </div>
  </aside>

  <main id="main">
    <div id="top">
      <div><h1 id="vTitle">Bảng việc</h1><div class="sub" id="vSub"></div></div>
      <div class="search"><span style="color:#646d80">⌕</span><input id="q" placeholder="Tìm task, tag, ghi chú…"></div>
      <div class="bellw">
        <button class="bell" id="bellBtn" title="Thông báo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="bdg" id="bellN" hidden></span></button>
        <div class="bellp" id="bellP" hidden></div>
      </div>
      <button class="btn" id="newBtn">+ Task mới</button>
    </div>
    <div id="view"></div>
    <div id="trashZone">🗑 Thả vào đây để chuyển vào thùng rác</div>
  </main>
</div>

<div id="scrim"></div>
<aside id="drawer"></aside>
<div id="fzFull" hidden><div class="fzbg"></div><div class="fzimg"></div><div class="fzdim"></div><div id="fzFullBody"></div><div id="fzFullLeft"></div></div>
<div id="toast"></div>

<script src="vendor/tiptap.js"></script>

<script src="app.js"></script>
</body>
</html>
